  - LO2
  micro_so_what: 'One walkthrough surfaced three independent weaknesses: dataset bias, spurious feature reliance, and OOD overconfidence. The dataset-bias weakness has parallels with what I had flagged in the Understanding AI DeutschFin proof of concept. So basically softmax does not know what it does not know.'
  micro_so_what_lo:
  - LO1
  - LO2
  micro_now_what: 'Always test the model on inputs it was not trained on. Applied in the Individual Presentation: these three weaknesses directly informed the IP subgroup analysis design (image size, brightness) and the shortcut-feature warning in the occlusion-sensitivity discussion.'
