  body: 'On this exercise I compared classical machine learning (HOG + SVM) with deep learning (ResNet50 transfer learning) for paediatric chest X-ray classification on a public dataset. The CNN clearly outperformed on the held-out test set. The stand-out result was the generalisation gap: the SVM''s cross-validation score did not transfer to the held-out test, while the CNN held up way better between CV and test. The cost-asymmetry framing in this work has parallels with what I had done in the previous module, Understanding AI: in the DeutschFin proof of concept the Hofmann cost matrix made false negatives (approving a bad applicant) five times more costly than false positives (rejecting a good applicant); here the same shape applies but is even more sensitive, because a missed pneumonia carries clinical consequences a false alarm does not. The recommendation is ResNet50 as a solid support for the clinician specialist, with conditions that need to be in place for deployment: clinician-set threshold on separate validation data with clinical cost input, ongoing subgroup analysis, drift monitoring, and out-of-distribution control. Lessons spanned scoping, reproducibility, calibration and ethics. Details and full reflection on the deep page.'
  key_takeaway: 'This was the activity where I learned the most from my own mistakes. I over-scoped the work, and the cost showed up in drifting numbers and a Keras `trainable` flag I had to learn to use properly as a setting that requires explicit verification. The lessons spanned: Keras fine-tuning has to be verified end-to-end (a nested-model `trainable` flag does not unfreeze inner layers by itself); CNN reproducibility is harder than classical ML because GPU non-determinism, dropout randomness and batch shuffling drift the results between runs; saved model work products make results traceable; XAI heatmaps are directional hints only, with causal evidence sitting outside what they can show; clinical context is paramount and most design choices were only possible after building image-processing and clinical understanding; and averages hide weaknesses (subgroup analysis flipped the trustworthiness picture when image size or brightness changed). Next steps if I revisit the project: rerun the fine-tuning correctly with the Keras flag fixed; validate first on another paediatric hospital dataset and adults if possible; compare DenseNet121 against ResNet50; add a calibration step (temperature scaling) so the saturated outputs become usable as probabilities for downstream decisions; tune per-model decision thresholds away from the 0.5 default; and evaluate borderline cases before any production deployment.'
