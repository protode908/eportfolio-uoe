  micro_so_what: 'The headline accuracy hides the per-image confidence variance. So 15 out of 15 correct on the sample, but the softmax outputs vary way more between confident and borderline cases than I expected. The face-classification accuracy disparity by demographic group makes the same point in an ethics context.'
